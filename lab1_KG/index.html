<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лабораторная работа 1 — CMYK / RGB / HSV</title>
<style>
  body { font-family: sans-serif; background: #f0f0f0; padding: 20px; margin: 0; }
  h1 { margin-top: 0; }
  .container { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .panel {
    background: #fff; padding: 15px; border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.1); min-width: 300px;
  }
  h2 { margin-top: 0; font-size: 18px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .row label { width: 18px; font-size: 14px; font-weight: 600; }
  .row input[type=text] {
    width: 44px; padding: 3px 5px; text-align: right; font-size: 14px;
  }
  .row .unit { width: 14px; font-size: 13px; color: #555; }
  #preview {
    width: 200px; height: 200px; border-radius: 12px;
    border: 2px solid #333; background: #ff0000;
  }
  .hint { font-size: 12px; color: #777; margin-top: 6px; }
  #hex_text { flex: 1; width: 80px; padding: 4px 6px; font-family: monospace; }
  #hex_text.bad { outline: 2px solid #d33; }

  .track {
    position: relative; flex: 1; height: 26px;
    border-radius: 6px; overflow: hidden; border: 1px solid #ccc;
  }
  .track > .gradient { position: absolute; inset: 0; }
  .track > input[type=range] {
    position: absolute; inset: 0; width: 100%; margin: 0;
    background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .track > input[type=range]::-webkit-slider-runnable-track { background: transparent; }
  .track > input[type=range]::-moz-range-track { background: transparent; }
  .track > input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 26px;
    background: rgba(255,255,255,0.9); border: 2px solid #333;
    border-radius: 4px; cursor: pointer;
  }
  .track > input[type=range]::-moz-range-thumb {
    width: 14px; height: 24px; background: rgba(255,255,255,0.9);
    border: 2px solid #333; border-radius: 4px; cursor: pointer;
  }
  #wheel { display: block; touch-action: none; }
</style>
</head>
<body>

<h1>Лабораторная работа 1 — CMYK / RGB / HSV</h1>

<div class="container">

  <div class="panel">
    <h2>Цвет</h2>
    <div id="preview"></div>
    <div class="row" style="margin-top:12px;">
      <input type="color" id="picker" value="#ff0000"
             style="width:60px;height:32px;cursor:pointer;">
      <input type="text" id="hex_text" value="#ff0000" maxlength="7"
             spellcheck="false" autocomplete="off" aria-label="HEX">
    </div>
    <div class="hint">HEX: #rrggbb или #rgb (допустимы только символы 0–9, a–f).</div>
    <canvas id="wheel" width="200" height="200"
            style="margin-top:12px;cursor:crosshair;"></canvas>
    <div class="hint">Клик/перетаскивание по кругу — H (угол) и S (радиус). V не меняется.</div>
  </div>

  <div class="panel"><h2>RGB</h2><div id="rgb_rows"></div>
    <div class="hint">R, G, B — целые 0…255</div></div>
  <div class="panel"><h2>CMYK</h2><div id="cmyk_rows"></div>
    <div class="hint">C, M, Y, K — целые 0…100 %</div></div>
  <div class="panel"><h2>HSV</h2><div id="hsv_rows"></div>
    <div class="hint">H — целое 0…360°, S и V — целые 0…100 %</div></div>

</div>

<script>
/* ==================== ПРЕОБРАЗОВАНИЯ ==================== */

function rgbToCmyk(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const k = 1 - Math.max(r, g, b);
  if (k >= 1) return { c: 0, m: 0, y: 0, k: 100 };
  return {
    c: ((1 - r - k) / (1 - k)) * 100,
    m: ((1 - g - k) / (1 - k)) * 100,
    y: ((1 - b - k) / (1 - k)) * 100,
    k: k * 100
  };
}

function cmykToRgb(c, m, y, k) {
  c /= 100; m /= 100; y /= 100; k /= 100;
  return {
    r: Math.round(255 * (1 - c) * (1 - k)),
    g: Math.round(255 * (1 - m) * (1 - k)),
    b: Math.round(255 * (1 - y) * (1 - k))
  };
}

// prev — прежние H и S: для серых/чёрных цветов они не определены,
// и вместо сброса в 0 сохраняем то, что было у пользователя.
function rgbToHsv(r, g, b, prev = { h: 0, s: 0 }) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = prev.h;
  let s = (mx === 0) ? prev.s : (d / mx) * 100;
  if (d !== 0) {
    if      (mx === r) h = 60 * (((g - b) / d) % 6);
    else if (mx === g) h = 60 * (((b - r) / d) + 2);
    else               h = 60 * (((r - g) / d) + 4);
    if (h < 0) h += 360;
  }
  return { h, s, v: mx * 100 };
}

function hsvToRgb(h, s, v) {
  s /= 100; v /= 100;
  h = ((h % 360) + 360) % 360;
  const c = v * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = v - c;
  let r1, g1, b1;
  if      (h < 60)  { r1 = c; g1 = x; b1 = 0; }
  else if (h < 120) { r1 = x; g1 = c; b1 = 0; }
  else if (h < 180) { r1 = 0; g1 = c; b1 = x; }
  else if (h < 240) { r1 = 0; g1 = x; b1 = c; }
  else if (h < 300) { r1 = x; g1 = 0; b1 = c; }
  else              { r1 = c; g1 = 0; b1 = x; }
  return {
    r: Math.round(255 * (r1 + m)),
    g: Math.round(255 * (g1 + m)),
    b: Math.round(255 * (b1 + m))
  };
}

/* ==================== УТИЛИТЫ ==================== */

const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function rgbToHex(r, g, b) {
  const h = n => clamp(n, 0, 255).toString(16).padStart(2, "0");
  return "#" + h(r) + h(g) + h(b);
}
const hexOf = c => rgbToHex(c.r, c.g, c.b);

function hexToRgb(hex) {
  hex = hex.replace("#", "");
  if (hex.length === 3) hex = hex.split("").map(ch => ch + ch).join("");
  return {
    r: parseInt(hex.slice(0, 2), 16),
    g: parseInt(hex.slice(2, 4), 16),
    b: parseInt(hex.slice(4, 6), 16)
  };
}

/* ==================== СОСТОЯНИЕ ==================== */
// rgb — источник истины; cmyk и hsv хранятся (целые) для отображения.
// Допустимые диапазоны компонент:
const MAX = { r: 255, g: 255, b: 255, c: 100, m: 100, y: 100, k: 100,
              h: 360, s: 100, v: 100 };
const UNIT = { c: "%", m: "%", y: "%", k: "%", h: "°", s: "%", v: "%" };

let rgb  = { r: 255, g: 0, b: 0 };
let cmyk = { c: 0, m: 100, y: 100, k: 0 };
let hsv  = { h: 0, s: 100, v: 100 };

/* ==================== ПОСТРОЕНИЕ ПОЛЕЙ ==================== */

function buildRows(containerId, names, onChange) {
  const box = $(containerId);
  names.forEach(n => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      `<label>${n.toUpperCase()}</label>` +
      `<input type="text" id="${n}_num" inputmode="numeric" maxlength="3" ` +
      `autocomplete="off" aria-label="${n.toUpperCase()}">` +
      `<span class="unit">${UNIT[n] || ""}</span>` +
      `<div class="track"><div class="gradient" id="${n}_grad"></div>` +
      `<input type="range" id="${n}_rng" min="0" max="${MAX[n]}" step="1" value="0"></div>`;
    box.appendChild(row);
    bindPair(n, onChange);
  });
}

// Числовое поле принимает только цифры, значение сразу ограничивается
// диапазоном компоненты; пустое/некорректное значение на цвет не влияет.
function bindPair(name, onChange) {
  const num = $(name + "_num");
  const rng = $(name + "_rng");
  const max = MAX[name];

  const commit = v => {
    v = clamp(v, 0, max);
    rng.value = v;
    onChange(name, v);
  };

  num.addEventListener("input", () => {
    let s = num.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "");
    if (s === "") { num.value = ""; return; }      // ждём ввода, цвет не меняем
    const v = Math.min(parseInt(s, 10), max);
    num.value = String(v);
    commit(v);
  });

  num.addEventListener("keydown", e => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    const v = clamp((+rng.value) + (e.key === "ArrowUp" ? 1 : -1), 0, max);
    num.value = v;
    commit(v);
  });

  // при потере фокуса пустое поле возвращается к текущему значению
  num.addEventListener("blur", () => { num.value = rng.value; });

  rng.addEventListener("input", () => {
    const v = +rng.value;
    num.value = v;
    commit(v);
  });
}

/* ==================== ЗАПИСЬ И ПЕРЕСЧЁТ ==================== */

function setVal(name, value) {
  const num = $(name + "_num");
  $(name + "_rng").value = value;
  if (document.activeElement !== num) num.value = value;
}

// newRgb — новый цвет; source — модель, которую правит пользователь
// ("cmyk" | "hsv" | другое): её значения не пересчитываются.
function apply(newRgb, source) {
  rgb = newRgb;
  if (source !== "cmyk") {
    const c = rgbToCmyk(rgb.r, rgb.g, rgb.b);
    cmyk = { c: Math.round(c.c), m: Math.round(c.m), y: Math.round(c.y), k: Math.round(c.k) };
  }
  if (source !== "hsv") {
    const h = rgbToHsv(rgb.r, rgb.g, rgb.b, hsv);
    hsv = { h: Math.round(h.h), s: Math.round(h.s), v: Math.round(h.v) };
  }
  render();
}

function render() {
  ["r", "g", "b"].forEach(n => setVal(n, rgb[n]));
  ["c", "m", "y", "k"].forEach(n => setVal(n, cmyk[n]));
  ["h", "s", "v"].forEach(n => setVal(n, hsv[n]));

  const hex = hexOf(rgb);
  $("preview").style.background = hex;
  $("picker").value = hex;
  if (document.activeElement !== $("hex_text")) {
    $("hex_text").value = hex;
    $("hex_text").classList.remove("bad");
  }
  updateGradients();
  drawWheel();
}

/* ==================== ГРАДИЕНТЫ ==================== */

function updateGradients() {
  const { r, g, b } = rgb;
  const line = (a, z) => `linear-gradient(to right, ${hexOf(a)}, ${hexOf(z)})`;

  $("r_grad").style.background = line({ r: 0, g, b }, { r: 255, g, b });
  $("g_grad").style.background = line({ r, g: 0, b }, { r, g: 255, b });
  $("b_grad").style.background = line({ r, g, b: 0 }, { r, g, b: 255 });

  const { c, m, y, k } = cmyk;
  $("c_grad").style.background = line(cmykToRgb(0, m, y, k), cmykToRgb(100, m, y, k));
  $("m_grad").style.background = line(cmykToRgb(c, 0, y, k), cmykToRgb(c, 100, y, k));
  $("y_grad").style.background = line(cmykToRgb(c, m, 0, k), cmykToRgb(c, m, 100, k));
  $("k_grad").style.background = line(cmykToRgb(c, m, y, 0), cmykToRgb(c, m, y, 100));

  const stops = [0, 60, 120, 180, 240, 300, 360].map(deg =>
    `${hexOf(hsvToRgb(deg, hsv.s, hsv.v))} ${(deg / 360) * 100}%`).join(", ");
  $("h_grad").style.background = `linear-gradient(to right, ${stops})`;
  $("s_grad").style.background = line(hsvToRgb(hsv.h, 0, hsv.v), hsvToRgb(hsv.h, 100, hsv.v));
  $("v_grad").style.background = line(hsvToRgb(hsv.h, hsv.s, 0), hsvToRgb(hsv.h, hsv.s, 100));
}

/* ==================== ОБРАБОТЧИКИ МОДЕЛЕЙ ==================== */

buildRows("rgb_rows", ["r", "g", "b"], (n, v) => {
  apply({ ...rgb, [n]: v }, "rgb");
});
buildRows("cmyk_rows", ["c", "m", "y", "k"], (n, v) => {
  cmyk = { ...cmyk, [n]: v };
  apply(cmykToRgb(cmyk.c, cmyk.m, cmyk.y, cmyk.k), "cmyk");
});
buildRows("hsv_rows", ["h", "s", "v"], (n, v) => {
  hsv = { ...hsv, [n]: v };
  apply(hsvToRgb(hsv.h, hsv.s, hsv.v), "hsv");
});

/* ==================== ПАЛИТРА + HEX ==================== */

$("picker").addEventListener("input", e => apply(hexToRgb(e.target.value), "hex"));

const hexInput = $("hex_text");
hexInput.addEventListener("input", () => {
  // только 0-9a-f, максимум 6 цифр, '#' ставится автоматически
  const digits = hexInput.value.replace(/[^0-9a-fA-F]/g, "").slice(0, 6).toLowerCase();
  hexInput.value = "#" + digits;
  const ok = digits.length === 6;
  hexInput.classList.toggle("bad", !ok && digits.length !== 3);
  if (ok) apply(hexToRgb(digits), "hex");
});
function commitHex() {
  const digits = hexInput.value.replace("#", "");
  if (digits.length === 3 || digits.length === 6) apply(hexToRgb(digits), "hex");
  hexInput.value = hexOf(rgb);
  hexInput.classList.remove("bad");
}
hexInput.addEventListener("blur", commitHex);
hexInput.addEventListener("keydown", e => { if (e.key === "Enter") commitHex(); });

/* ==================== HSV-КРУГ ==================== */

const wheel = $("wheel");
const wctx = wheel.getContext("2d");
const WR = wheel.width / 2 - 2;
const wheelBase = document.createElement("canvas");
wheelBase.width = wheel.width; wheelBase.height = wheel.height;

(function buildWheel() {
  const W = wheel.width, H = wheel.height, cx = W / 2, cy = H / 2;
  const ctx = wheelBase.getContext("2d");
  const img = ctx.createImageData(W, H), data = img.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const dx = x - cx, dy = y - cy, dist = Math.hypot(dx, dy);
      const i = (y * W + x) * 4;
      if (dist > WR) continue;
      let h = Math.atan2(dy, dx) * 180 / Math.PI;
      if (h < 0) h += 360;
      const c = hsvToRgb(h, (dist / WR) * 100, 100);
      data[i] = c.r; data[i + 1] = c.g; data[i + 2] = c.b; data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
})();

function drawWheel() {
  const cx = wheel.width / 2, cy = wheel.height / 2;
  wctx.clearRect(0, 0, wheel.width, wheel.height);
  wctx.drawImage(wheelBase, 0, 0);
  const ang = hsv.h * Math.PI / 180, rad = (hsv.s / 100) * WR;
  wctx.beginPath();
  wctx.arc(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, 6, 0, Math.PI * 2);
  wctx.strokeStyle = "#fff"; wctx.lineWidth = 3; wctx.stroke();
  wctx.strokeStyle = "#000"; wctx.lineWidth = 1; wctx.stroke();
}

function pickFromWheel(e) {
  const rect = wheel.getBoundingClientRect();
  const dx = (e.clientX - rect.left) * (wheel.width / rect.width) - wheel.width / 2;
  const dy = (e.clientY - rect.top) * (wheel.height / rect.height) - wheel.height / 2;
  let h = Math.atan2(dy, dx) * 180 / Math.PI;
  if (h < 0) h += 360;
  const s = Math.min(Math.hypot(dx, dy) / WR, 1) * 100;
  hsv = { h: Math.round(h), s: Math.round(s), v: hsv.v };
  apply(hsvToRgb(hsv.h, hsv.s, hsv.v), "hsv");
}
let dragging = false;
wheel.addEventListener("pointerdown", e => {
  dragging = true; wheel.setPointerCapture(e.pointerId); pickFromWheel(e);
});
wheel.addEventListener("pointermove", e => { if (dragging) pickFromWheel(e); });
wheel.addEventListener("pointerup",     () => { dragging = false; });
wheel.addEventListener("pointercancel", () => { dragging = false; });

/* ==================== СТАРТ ==================== */
apply(rgb, "rgb");
</script>
</body>
</html>
