<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лабораторная работа 4. Отсечение (вариант 8)</title>
<style>
  /* ---------- тема и базовые стили ---------- */
  :root {
    --bg: #fff; --fg: #1c1f24; --mut: #667085; --card: #f5f7fa;
    --bd: #d0d5dd; --grid: #e4e7ec;
    --win: #1d4ed8; --winf: rgba(29, 78, 216, .08);
    --orig: #e11d48; --vis: #16a34a; --acc: #1d4ed8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --fg: #e6e8ec; --mut: #98a2b3; --card: #1d2127;
      --bd: #323843; --grid: #2a2f38;
      --win: #60a5fa; --winf: rgba(96, 165, 250, .12);
      --orig: #fb7185; --vis: #4ade80; --acc: #60a5fa;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c; --fg: #e6e8ec; --mut: #98a2b3; --card: #1d2127;
    --bd: #323843; --grid: #2a2f38;
    --win: #60a5fa; --winf: rgba(96, 165, 250, .12);
    --orig: #fb7185; --vis: #4ade80; --acc: #60a5fa;
  }

  /* ---------- общий каркас ---------- */
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .sub { color: var(--mut); margin: 0 0 14px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab, button {
    font: inherit; border: 1px solid var(--bd); background: var(--card);
    color: var(--fg); padding: 7px 13px; border-radius: 8px; cursor: pointer;
  }
  .tab.on, button.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
  .grid { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; }
  textarea {
    width: 100%; box-sizing: border-box; height: 230px;
    font: 13px/1.4 ui-monospace, Consolas, monospace;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--bd); border-radius: 8px; padding: 8px; resize: vertical;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  canvas { width: 100%; height: 540px; display: block; background: var(--bg); border: 1px solid var(--bd); border-radius: 10px; }
  .leg { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; color: var(--mut); font-size: 13px; }
  .leg i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 5px; }
  #err { color: var(--orig); margin-top: 8px; white-space: pre-wrap; }
  .sm { font-size: 12.5px; color: var(--mut); }
</style>
</head>
<body>
<main>
  <h1>Лабораторная работа 4. Алгоритмы отсечения</h1>
  <p class="sub">
    Вариант 8 · Часть 1: алгоритм Лианга-Барски ·
    Часть 2: алгоритм Кируса-Бека (отсечение отрезков выпуклым многоугольником)
  </p>

  <div class="tabs">
    <button class="tab on" id="t1">Часть 1. Лианг-Барски (прямоугольное окно)</button>
    <button class="tab" id="t2">Часть 2. Кирус-Бек (выпуклое окно)</button>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <b>Входные данные</b>
        <div class="sm" id="fmt" style="margin:4px 0 6px"></div>
        <textarea id="inp" spellcheck="false"></textarea>
        <div class="row">
          <button class="pri" id="run">Выполнить отсечение</button>
          <button id="rnd">Случайный пример</button>
          <button id="ex">Пример</button>
          <button id="load">Загрузить файл…</button>
          <input type="file" id="file" accept=".txt,text/plain" hidden>
        </div>
        <div id="err"></div>
      </div>
    </div>
    <div>
      <canvas id="cv"></canvas>
      <div class="leg">
        <span><i style="border-color:var(--win)"></i>отсекающее окно</span>
        <span><i style="border-color:var(--orig);border-top-style:dashed"></i>исходные отрезки</span>
        <span><i style="border-color:var(--vis);border-top-width:5px"></i>видимые части</span>
      </div>
    </div>
  </div>
</main>

<script>
/* ---------- утилиты и состояние ---------- */
const $ = id => document.getElementById(id);
const f = v => String(+v.toFixed(3));
let mode = 1, data = null, sel = -1;

/* ---------- примеры входных данных ---------- */
const EX1 = "4 *число отрезков*\n2 1 8 6\n0 0 2 2\n4 3 6 4\n1 6 9 6\n3 2 7 5 *Xmin Ymin Xmax Ymax*";
const EX2 = "4 *число отрезков*\n0 0 10 8\n2 3 6 4\n-1 5 11 5\n8 0 9 1\n6\n4 0 8 1 10 4 7 7 3 6 1 3 *m и m вершин окна (x y)*";

const FM1 = "n — число отрезков; далее n строк «x1 y1 x2 y2»; последняя строка «Xmin Ymin Xmax Ymax». Текст между звёздочками игнорируется.";
const FM2 = "n; n строк «x1 y1 x2 y2»; затем m (число вершин окна) и m пар «x y» — вершины выпуклого многоугольника (в любом направлении обхода).";

/* ---------- переключение режимов и кнопки ---------- */
function setMode(m) {
  mode = m;
  sel = -1;
  $("t1").classList.toggle("on", m === 1);
  $("t2").classList.toggle("on", m === 2);
  $("fmt").textContent = m === 1 ? FM1 : FM2;
  $("inp").value = m === 1 ? EX1 : EX2;
  run();
}
$("t1").onclick = () => setMode(1);
$("t2").onclick = () => setMode(2);
$("ex").onclick = () => { $("inp").value = mode === 1 ? EX1 : EX2; sel = -1; run(); };
$("run").onclick = () => { sel = -1; run(); };
$("load").onclick = () => $("file").click();
$("file").onchange = e => {
  const r = new FileReader();
  r.onload = () => { $("inp").value = r.result; sel = -1; run(); };
  if (e.target.files[0]) r.readAsText(e.target.files[0]);
};
$("rnd").onclick = () => {
  const R = (a, b) => Math.round(a + Math.random() * (b - a));
  const n = R(5, 10);
  let s = n + "\n";
  for (let i = 0; i < n; i++)
    s += [R(-3, 13), R(-3, 11), R(-3, 13), R(-3, 11)].join(" ") + "\n";
  if (mode === 1) s += "2 2 9 7";
  else {
    const m = R(5, 7), pts = [];
    for (let i = 0; i < m; i++) {
      const a = 2 * Math.PI * i / m;
      pts.push(f(5.5 + 4.5 * Math.cos(a)) + " " + f(4.5 + 3.5 * Math.sin(a)));
    }
    s += m + "\n" + pts.join("  ");
  }
  $("inp").value = s;
  sel = -1;
  run();
};

/* ---------- разбор входного текста ---------- */
function parse(t) {
  const a = t.replace(/\*[^*]*\*/g, " ").split(/[\s,;]+/).filter(Boolean).map(Number);
  if (a.some(isNaN)) throw "Во входных данных есть нечисловое значение.";
  let p = 0;
  const n = a[p++];
  if (!Number.isInteger(n) || n < 1) throw "n должно быть положительным целым.";
  const segs = [];
  for (let i = 0; i < n; i++) {
    if (p + 4 > a.length) throw "Недостаточно координат отрезков.";
    segs.push(a.slice(p, p + 4));
    p += 4;
  }
  if (mode === 1) {
    if (p + 4 > a.length) throw "Не заданы координаты окна Xmin Ymin Xmax Ymax.";
    let [x0, y0, x1, y1] = a.slice(p, p + 4);
    if (x0 >= x1 || y0 >= y1) throw "Требуется Xmin < Xmax и Ymin < Ymax.";
    return { segs, win: [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], rect: [x0, y0, x1, y1] };
  }
  const m = a[p++];
  if (!Number.isInteger(m) || m < 3 || p + 2 * m > a.length)
    throw "Некорректное число вершин окна m или не хватает координат.";
  let v = [];
  for (let i = 0; i < m; i++) v.push([a[p + 2 * i], a[p + 2 * i + 1]]);
  let ar = 0;
  for (let i = 0; i < m; i++) {
    const q = v[(i + 1) % m];
    ar += v[i][0] * q[1] - q[0] * v[i][1];
  }
  if (Math.abs(ar) < 1e-12) throw "Окно вырождено (нулевая площадь).";
  if (ar < 0) v.reverse();
  for (let i = 0; i < m; i++) {
    const A = v[i], B = v[(i + 1) % m], C = v[(i + 2) % m];
    const c = (B[0] - A[0]) * (C[1] - B[1]) - (B[1] - A[1]) * (C[0] - B[0]);
    if (c < -1e-9) throw "Окно не является выпуклым многоугольником.";
  }
  return { segs, win: v };
}

/* ---------- алгоритм Лианга-Барски: t*Si <= Qi ---------- */
function liangBarsky(s, r) {
  const [x1, y1, x2, y2] = s, [xmin, ymin, xmax, ymax] = r;
  const dx = x2 - x1, dy = y2 - y1;
  const S = [-dy, -dx, dy, dx];
  const Q = [y1 - ymin, x1 - xmin, ymax - y1, xmax - x1];
  let tin = 0, tout = 1;
  for (let i = 0; i < 4; i++) {
    const si = S[i], qi = Q[i];
    if (si === 0) {
      if (qi < 0) return { vis: false };
    } else {
      const t = qi / si;
      if (si < 0) tin = Math.max(tin, t);
      else tout = Math.min(tout, t);
    }
    if (tin > tout) return { vis: false };
  }
  return {
    vis: true, tin, tout,
    a: [x1 + tin * dx, y1 + tin * dy],
    b: [x1 + tout * dx, y1 + tout * dy]
  };
}

/* ---------- алгоритм Кируса-Бека для выпуклого окна ---------- */
function cyrusBeck(s, V) {
  const [x1, y1, x2, y2] = s;
  const dx = x2 - x1, dy = y2 - y1, m = V.length;
  let tin = 0, tout = 1;
  for (let i = 0; i < m; i++) {
    const A = V[i], B = V[(i + 1) % m];
    const N = [-(B[1] - A[1]), B[0] - A[0]];
    const S = N[0] * dx + N[1] * dy;
    const W = N[0] * (x1 - A[0]) + N[1] * (y1 - A[1]);
    if (Math.abs(S) < 1e-12) {
      if (W < 0) return { vis: false };
    } else {
      const t = -W / S;
      if (S > 0) tin = Math.max(tin, t);
      else tout = Math.min(tout, t);
    }
    if (tin > tout) return { vis: false };
  }
  return {
    vis: true, tin, tout,
    a: [x1 + tin * dx, y1 + tin * dy],
    b: [x1 + tout * dx, y1 + tout * dy]
  };
}

/* ---------- запуск отсечения ---------- */
function run() {
  $("err").textContent = "";
  try {
    const d = parse($("inp").value);
    d.res = d.segs.map(s => mode === 1 ? liangBarsky(s, d.rect) : cyrusBeck(s, d.win));
    data = d;
  } catch (e) {
    $("err").textContent = String(e);
    return;
  }
  draw();
}

/* ---------- отрисовка сцены ---------- */
function draw() {
  const cv = $("cv");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr;
  cv.height = H * dpr;
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cs = getComputedStyle(document.documentElement);
  const C = n => cs.getPropertyValue(n).trim();

  let xs = [0], ys = [0];
  data.win.forEach(p => { xs.push(p[0]); ys.push(p[1]); });
  data.segs.forEach(s => { xs.push(s[0], s[2]); ys.push(s[1], s[3]); });

  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const px = x1 - x0 || 1, py = y1 - y0 || 1;
  x0 -= px * .06; x1 += px * .06;
  y0 -= py * .06; y1 += py * .06;

  const L = 34, B = 26;
  const sc = Math.min((W - L - 10) / (x1 - x0), (H - B - 10) / (y1 - y0));
  const X = x => L + (x - x0) * sc;
  const Y = y => H - B - (y - y0) * sc;

  // сетка
  const rg = 60 / sc;
  const e = Math.pow(10, Math.floor(Math.log10(rg)));
  const st = [1, 2, 5, 10].map(k => k * e).find(v => v >= rg);
  c.font = "11px system-ui";
  c.lineWidth = 1;

  const xa = Math.max(L, Math.min(W - 10, X(0)));
  const ya = Math.min(H - B, Math.max(10, Y(0)));

  for (let v = Math.ceil(x0 / st) * st; v <= x1; v += st) {
    const x = X(v);
    c.strokeStyle = C("--grid");
    c.beginPath(); c.moveTo(x, 10); c.lineTo(x, H - B); c.stroke();
    c.fillStyle = C("--mut");
    c.textAlign = "center";
    c.fillText(f(v), x, H - B + 14);
  }
  for (let v = Math.ceil(y0 / st) * st; v <= y1; v += st) {
    const y = Y(v);
    c.strokeStyle = C("--grid");
    c.beginPath(); c.moveTo(L, y); c.lineTo(W - 10, y); c.stroke();
    c.fillStyle = C("--mut");
    c.textAlign = "right";
    c.fillText(f(v), L - 5, y + 4);
  }

  // оси
  c.strokeStyle = C("--fg");
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(L, ya); c.lineTo(W - 8, ya);
  c.moveTo(xa, H - B); c.lineTo(xa, 8);
  c.stroke();
  c.fillStyle = C("--fg");
  c.textAlign = "left";
  c.fillText("x", W - 14, ya - 6);
  c.fillText("y", xa + 6, 16);

  // отсекающее окно
  c.beginPath();
  data.win.forEach((p, i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])));
  c.closePath();
  c.fillStyle = C("--winf");
  c.fill();
  c.strokeStyle = C("--win");
  c.lineWidth = 2.5;
  c.stroke();

  // исходные отрезки
  data.segs.forEach((s, i) => {
    c.strokeStyle = C("--orig");
    c.lineWidth = i === sel ? 2 : 1.3;
    c.setLineDash([6, 4]);
    c.beginPath();
    c.moveTo(X(s[0]), Y(s[1]));
    c.lineTo(X(s[2]), Y(s[3]));
    c.stroke();
    c.setLineDash([]);
    c.fillStyle = C("--orig");
    c.textAlign = "left";
    c.fillText(i + 1, X(s[0]) + 4, Y(s[1]) - 4);
  });

  // видимые части
  data.res.forEach((r, i) => {
    if (!r.vis) return;
    c.strokeStyle = C("--vis");
    c.lineWidth = i === sel ? 6 : 4;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(X(r.a[0]), Y(r.a[1]));
    c.lineTo(X(r.b[0]), Y(r.b[1]));
    c.stroke();
    c.fillStyle = C("--vis");
    [r.a, r.b].forEach(p => {
      c.beginPath();
      c.arc(X(p[0]), Y(p[1]), 3.5, 0, 7);
      c.fill();
    });
  });
  c.lineCap = "butt";
}

/* ---------- реакция на изменение окна ---------- */
window.addEventListener("resize", () => data && draw());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => data && draw());
setMode(1);
</script>
</body>
</html>
